<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate">
    <title>Physiq</title>
    <meta name="description" content="app focado em saúde e performance">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#09090B">
    <!-- Tema antes do 1º quadro (P21: escuro padrão; claro só para quem escolheu em Aparência — src/ui/tema/useTema.ts) -->
    <script>try{var t=localStorage.getItem("physiq_tema")==="claro"?"claro":"escuro";document.documentElement.setAttribute("data-tema",t);if(t==="claro")document.querySelector('meta[name="theme-color"]').setAttribute("content","#FAFAFA")}catch(e){}</script>
    <style>html{background:#09090B}html[data-tema="claro"]{background:#FAFAFA}</style>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Physiq">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="author" content="Weslley Bertoldo" />

    <!-- Abre DNS+TLS com o Supabase e o PowerSync antes do JS pedir (poupa ~100-300 ms na abertura) -->

    <link rel="preconnect" href="https://69cc4d1df69619e9d4834456.powersync.journeyapps.com" crossorigin>
    <!-- Fonte local (sem Google Fonts): a Geist (subset latino) começa a baixar junto com o CSS -->
