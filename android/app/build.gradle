apply plugin: 'com.android.application'

android {
    namespace = "com.bertoldo.physiqcalc"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bertoldo.physiqcalc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // W1 da loja: false no APK do site (debug e release); o playRelease liga (sem o instalador de APK — MainActivity)
        buildConfigField "boolean", "LOJA", "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
        // W4 da loja: a chave de UPLOAD da Google Play (PKCS12, alias "upload") — só o playRelease usa. Vem das variáveis
        // PLAY_UPLOAD_* (no CI, dos segredos de mesmo nome; no notebook, do ~/keystores/physiq-play-upload.env). O Google assina
        // o app instalado pela loja com a chave de assinatura DELE (Play App Signing — W5); a chave do APK do site nunca vai à loja.
        loja {
            def lojaKeystoreFile = System.getenv("PLAY_UPLOAD_KEYSTORE_FILE")
            if (lojaKeystoreFile) {
                storeFile file(lojaKeystoreFile)
                storePassword System.getenv("PLAY_UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PLAY_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("PLAY_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
        // W1 da loja (Google Play): igual ao release (minify e shrink), mas o manifesto de src/playRelease/ tira a permissão
        // REQUEST_INSTALL_PACKAGES e o MainActivity não registra o ApkInstallerPlugin (BuildConfig.LOJA) — a loja proíbe app que
        // se atualiza por fora dela. Web: npm run build:loja. AAB: scripts/ci/aab-loja.sh (CI e npm run build:aab).
        // W4 da loja: assina SÓ com a chave de upload (signingConfigs.loja). O initWith copia o signingConfig do release (a chave
        // do APK do site, quando KEYSTORE_FILE existe): zerado aqui de propósito — sem PLAY_UPLOAD_KEYSTORE_FILE o playRelease
        // sai SEM assinatura (a conferência do CI recusa), nunca com a chave do site.
        playRelease {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField "boolean", "LOJA", "true"
            signingConfig = null
            def lojaKeystoreFile = System.getenv("PLAY_UPLOAD_KEYSTORE_FILE")
            if (lojaKeystoreFile) {
                signingConfig = signingConfigs.loja
            } else if (System.getenv("PLAY_APK_CHAVE_DEBUG") == "1") {
                // play-W6: o APK "loja + staging" (scripts/ci/aab-loja.sh apk-staging) — o testador de licença instala por fora
                // um build com a chave de DEBUG (a Play aceita, com o pacote igual). Só com a variável explícita e sem a chave
                // de upload; nunca vai para a loja (a conferência do AAB recusa qualquer chave que não seja a de upload).
                signingConfig = signingConfigs.debug
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // play-W6: a Play Billing Library SÓ na versão da Google Play (playRelease) — o APK do site sai sem a biblioteca e sem a
    // permissão com.android.vending.BILLING que o AAR declara (scripts/ci/aab-loja.sh confere as 2 saídas). O plugin que a
    // usa mora em src/playRelease/java (PlayBillingPlugin + PlataformaLoja). A 9 vale até 31/08/2028 (a 8, até 31/08/2027).
    playReleaseImplementation "com.android.billingclient:billing:9.1.0"
    // restaurar-login: "entrar já logado no celular novo" — a chave de volta (API Restore Credentials; a regra "Zero-Tap Sign-In" da
    // Google Play de abr/2027) no RestaurarLoginPlugin. Nos 2 builds (D2: o APK do site e o da loja — a trava do servidor desliga tudo).
    // A 1.6.0 é a estável (08/04/2026); o AAR credentials-play-services-auth já traz a regra do R8 (a fase 0 provou: sem regra nova no
    // proguard-rules.pro, o build minificado se comporta igual). Puxa play-services-auth, -fido, -auth-blockstore e o kotlin-stdlib (+~330 KB de DEX).
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
