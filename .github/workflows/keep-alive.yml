name: Keep Supabase + PowerSync Active

on:
  schedule:
    # Supabase: 4x/dia. Criterio oficial do auto-pause NAO e "qualquer
    # atividade reseta o contador" — e "sufficient user database activity...
    # a few user requests to the database EACH DAY over the previous week"
    # (docs/guides/platform/free-project-pausing). Ping espacado (3-5 dias)
    # falhou no NutriTrack: runs verdes 28/06 e 01/07 e pausou 04/07/2026.
    - cron: '19 3,9,15,21 * * *'
    # PowerSync: deploy real a cada 4 dias (deploy 4x/dia seria excessivo), num MINUTO PRÓPRIO: com as 2 crons em '19 9'
    # o GitHub dispara um run só (o github.event.schedule é o da de cima) e o job do PowerSync ficava "skipped" — de
    # 05/09/2026 a 08/10/2026 ele só rodou à mão (hml-10).
    - cron: '41 10 */4 * *'
  workflow_dispatch:
    inputs:
      so:
        description: "Qual job rodar à mão (W28: 'principal' prova o ping do banco principal sem o deploy do PowerSync)"
        type: choice
        default: todos
        options: [todos, supabase, principal, powersync]

jobs:
  keep-alive-supabase:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["todos","supabase"]'), github.event.inputs.so || 'todos')) || github.event.schedule == '19 3,9,15,21 * * *'
    runs-on: ubuntu-latest
    steps:
      # Troca da chave vazada (04/10/2026): a anon legada que ficava escrita aqui foi desligada → a publishable do Treino
      # vem do segredo TREINO_SUPABASE_PUBLISHABLE_KEY (chave pública, igual à do principal logo abaixo).
      # hml-10 (08/10/2026): o visitante não lê mais tabela nenhuma (hml-01, H-10) → o ping é a RPC manter_ativo(), que vai
      # ao Postgres como uma leitura e só devolve true (supabase/migrations/20261008100100_hml10_manter_ativo_treino.sql).
      - name: Pings REST/PostgREST (atividade que CONTA p/ o auto-pause)
        env:
          CHAVE: ${{ secrets.TREINO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          [ -n "$CHAVE" ] || (echo "ERRO: segredo TREINO_SUPABASE_PUBLISHABLE_KEY vazio" && exit 1)
          # 3 queries por run x 4 runs/dia = ~12 queries/dia ("a few each day")
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $CHAVE" \
              "https://uxwpwdbbnlticxgtzcsb.supabase.co/rest/v1/rpc/manter_ativo")
            echo "PhysiqCalc REST ping $i/3: HTTP $CODE"
            [ "$CODE" = "200" ] || (echo "ERRO" && exit 1)
            sleep 2
          done

      - name: Executar SQL real no Postgres (camada extra Supabase)
        run: |
          set -e
          RES=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT 1 as alive, now() as ts"}' \
            "https://api.supabase.com/v1/projects/uxwpwdbbnlticxgtzcsb/database/query")
          CODE=$(echo "$RES" | tail -1)
          echo "PhysiqCalc SQL ping: HTTP $CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || (echo "ERRO" && exit 1)

  # Physiq W28 (virada): o BANCO PRINCIPAL (hkxvtsbwctxkrqzkkdoz, o Supabase do antigo PhysiqNutri) — o ping vinha do
  # keep-supabase-active.yml do repositório physiqnutri, que para quando ele é arquivado. Mesmo horário e mesma régua do de cima
  # (leituras REST de verdade + SQL pela Management API). Segredos: PRINCIPAL_SUPABASE_PUBLISHABLE_KEY (chave pública) e SUPABASE_PAT.
  # hml-10 (08/10/2026): a leitura REST é a RPC manter_ativo() (supabase-principal/migrations/20261008100000_hml10_manter_ativo.sql)
  # — o visitante não lê mais public.alimentos desde a hml-01 (H-10) e o ping dava 401.
  keep-alive-principal:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["todos","principal"]'), github.event.inputs.so || 'todos')) || github.event.schedule == '19 3,9,15,21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pings REST/PostgREST do principal (atividade que CONTA p/ o auto-pause)
        env:
          CHAVE: ${{ secrets.PRINCIPAL_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          [ -n "$CHAVE" ] || (echo "ERRO: segredo PRINCIPAL_SUPABASE_PUBLISHABLE_KEY vazio" && exit 1)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $CHAVE" "https://hkxvtsbwctxkrqzkkdoz.supabase.co/auth/v1/health")
          echo "Principal auth health: HTTP $CODE"
          [ "$CODE" = "200" ] || (echo "ERRO" && exit 1)
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $CHAVE" \
              "https://hkxvtsbwctxkrqzkkdoz.supabase.co/rest/v1/rpc/manter_ativo")
            echo "Principal REST ping $i/3: HTTP $CODE"
            [ "$CODE" = "200" ] || (echo "ERRO" && exit 1)
            sleep 2
          done

      - name: Executar SQL real no Postgres do principal (camada extra Supabase)
        run: |
          set -e
          RES=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PAT }}" \
            -H "Content-Type: application/json" -H "User-Agent: physiqcalc-keepalive" \
            -d '{"query":"SELECT 1 as alive, now() as ts"}' \
            "https://api.supabase.com/v1/projects/hkxvtsbwctxkrqzkkdoz/database/query")
          CODE=$(echo "$RES" | tail -1)
          echo "Principal SQL ping: HTTP $CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || (echo "ERRO" && exit 1)

  keep-alive-powersync:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["todos","powersync"]'), github.event.inputs.so || 'todos')) || github.event.schedule == '41 10 */4 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # PowerSync Free Plan desprovisiona instancias sem DEPLOYS nem CONEXOES DE
      # CLIENTE por 7 dias. Pings HTTP no /probes/liveness NAO contam (confirmado
      # em docs.powersync.com/resources/usage-and-billing). Por isso fazemos um
      # deploy real das sync rules a cada 4 dias, que conta como atividade e
      # mantem a instancia Production provisionada.
      # A instancia Development (PowerSync do staging) foi DESLIGADA em 03/09/2026
      # para aliviar a VM Nano do Supabase (Disk IO); desde a hml-04c (07/10/2026)
      # o build de staging nao usa PowerSync nenhum.
      - name: Deploy sync-config (Production) — mantem instancia ativa
        env:
          PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_PAT }}
        run: |
          npx -y powersync@latest deploy sync-config \
            --instance-id 69cc4d1df69619e9d4834456 \
            --project-id 69cc4d1caaa9a30007b4ec2c \
            --org-id 69cc4bec866ae00007694860 < /dev/null
