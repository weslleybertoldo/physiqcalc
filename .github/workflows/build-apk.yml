name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # o pacote legado `tools` saiu do repositório do SDK (run 35354769934 morreu em 18/09/2026);
          # o Gradle baixa platforms/build-tools que faltarem (mesmo fix do WatchMov, 14/09/2026)
          packages: platform-tools

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Compilando APK com versão: $CURRENT"

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          IFS='.' read -r MA MI PA <<< "$V"
          PA=${PA:-0}
          # versionCode = inteiro crescente (MAJOR*100000 + MINOR*100 + PATCH).
          # Sem isso o APK sai sempre com versionCode 1 e o Android recusa o update.
          # Physiq 3.0 (W0): era MAJOR*10000 — 3.0 daria 30000, MENOR que os 33600 da 2.136, e o
          # Android recusaria a atualização. Com *100000: 3.0 = 300000 (e 3.1, 3.2… seguem subindo).
          CODE=$((MA * 100000 + MI * 100 + PA))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/physiqcalc-release.keystore

      - name: Firebase do push (google-services.json)
        # Physiq W20c: o arquivo vem do segredo GOOGLE_SERVICES_JSON e NUNCA entra no git; o android/app/build.gradle só aplica
        # o plugin do Google quando ele existe. Sem o segredo o APK sai sem push (o app segue com sino, e-mail e notificação local).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON vazio: APK sem push (FCM)"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json'); const ok=(j.client||[]).some((c)=>c&&c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.bertoldo.physiqcalc'); if(!ok){console.error('google-services.json sem o app com.bertoldo.physiqcalc');process.exit(1)} console.log('google-services.json escrito: projeto Firebase '+j.project_info.project_id)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        # hml-08 (H-22): o build do app (VITE_APP_NATIVO=1) — o painel master fica só no site (a Vercel segue no npm run build)
        run: npm run build:apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          # banco principal do Physiq (spec 7.8): entra no APK antes da W3; ninguém lê ainda
          VITE_PRINCIPAL_URL: ${{ secrets.VITE_PRINCIPAL_URL }}
          VITE_PRINCIPAL_ANON_KEY: ${{ secrets.VITE_PRINCIPAL_ANON_KEY }}
          # hml-10 (H-25): o build com banco exige o schema (vite.config.ts); o APK é o de produção. Texto, não segredo
          VITE_DB_SCHEMA: public

      - name: Conferir que o APK sai sem o painel master
        run: bash scripts/ci/sem-master.sh dist

      - name: Conferir que o APK sai sem os textos legais novos
        # hml-11 (H-28): a Política, os Termos e os Termos de assinatura novos esperam o advogado — só no build de staging até a virada
        run: bash scripts/ci/sem-texto-legal-novo.sh dist

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: physiqcalc-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Conferir o Firebase no APK
        # Physiq W20c: com o google-services.json, o Gradle tem que ter gerado o google_app_id (o push só liga com ele)
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "APK sem Firebase (sem o segredo GOOGLE_SERVICES_JSON): o push fica desligado"
            exit 0
          fi
          f=$(grep -rl 'google_app_id' android/app/build/generated --include=values.xml | head -1)
          if [ -z "$f" ]; then
            echo "::error::google-services NÃO foi aplicado (sem google_app_id nos recursos gerados)"
            exit 1
          fi
          echo "Firebase no APK: plugin google-services aplicado (google_app_id em $f)"

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physiq-v${{ steps.version.outputs.current }}
          path: android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: Physiq v${{ steps.version.outputs.current }}
          body: |
            ## Physiq v${{ steps.version.outputs.current }}

            APK gerado automaticamente.

            **Download:** Baixe o `Physiq-v${{ steps.version.outputs.current }}.apk` abaixo.
          files: android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}.apk
          generate_release_notes: true
          make_latest: true

      - name: Bump version for next build
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_MINOR=$((MINOR + 1))
          NEXT="$MAJOR.$NEW_MINOR"
          echo "Preparando próxima versão: $CURRENT -> $NEXT"

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEXT';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --staged --quiet || git commit -m "chore: bump version to v$NEXT [skip ci]"
          git push

  # W4 da loja — o AAB da Google Play (playRelease + npm run build:loja), em PARALELO ao `build`: mesmo commit, mesma versão e
  # mesma fórmula de versionCode do APK. Sem `needs` dos 2 lados: não bloqueia a release nem o bump do APK do site. O AAB NÃO
  # entra na release (o site e o atualizador do APK leem a release): sai só como artifact do workflow (90 dias). Assinado SÓ com
  # a chave de upload; a conferência (scripts/ci/aab-loja.sh) falha o job se a assinatura, a permissão, o site, o versionCode ou
  # o Firebase não baterem. Doc: docs/loja-google-play.md.
  aab-loja:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # igual ao job do APK: o Gradle baixa platforms/build-tools que faltarem
          packages: platform-tools

      - name: Versão (a mesma do APK)
        id: version
        run: bash scripts/ci/aab-loja.sh versao

      - name: Firebase do push (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci/aab-loja.sh firebase

      - name: Install dependencies
        run: npm ci

      - name: Site da versão da loja (build:loja) + Capacitor
        run: bash scripts/ci/aab-loja.sh web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_PRINCIPAL_URL: ${{ secrets.VITE_PRINCIPAL_URL }}
          VITE_PRINCIPAL_ANON_KEY: ${{ secrets.VITE_PRINCIPAL_ANON_KEY }}
          # hml-10 (H-25): o build com banco exige o schema (vite.config.ts); a versão da loja é a de produção. Texto, não segredo
          VITE_DB_SCHEMA: public

      - name: AAB assinado com a chave de upload
        run: bash scripts/ci/aab-loja.sh gradle
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}

      - name: Conferir o AAB (assinatura, permissão, site da loja, versionCode, Firebase)
        run: bash scripts/ci/aab-loja.sh conferir

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physiq-v${{ steps.version.outputs.current }}-loja
          path: android/app/build/outputs/bundle/playRelease/Physiq-v${{ steps.version.outputs.current }}-loja.aab
          retention-days: 90
          if-no-files-found: error
