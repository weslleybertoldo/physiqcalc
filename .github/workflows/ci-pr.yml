name: CI do PR

# hml-13 (H-31): todo PR para a main passa por aqui ANTES do merge — lint, tipos, SECURITY DEFINER nas migrations novas, testes
# dos Workers e dos scripts de CI (node --test), o Vitest e (hml-18b) o build com a guarda de chunks. O ruleset "main protegida" exige
# o check "checar-pr" (app GitHub Actions).
# SEM filtro de caminho de propósito: check obrigatório que não roda fica "Expected" e trava o PR.
# NÃO pôr [skip ci]/[skip actions] nos commits da branch (o GitHub não roda este workflow e o PR trava). PR sem release (só E2E,
# doc): o marcador vai só no título do squash — gh pr merge <n> --squash --subject "<título> [skip actions] (#<n>)".
# PR travado por um commit com marcador: commit novo SEM o marcador na branch (git commit --allow-empty -m "rodar o check" + push).
# O workflow_dispatch roda o check na mesma ponta, mas NÃO destrava o PR (provado na hml-13, PR #160) — serve só para conferir uma branch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checar-pr:
    name: checar-pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        id: deps
        run: npm ci

      # Daqui em diante cada passo roda mesmo se o anterior falhou (o PR mostra todos os erros de uma vez); o job fica vermelho
      # se qualquer um falhar.
      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint

      - name: Tipos (app e vite.config)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run tipos

      - name: SECURITY DEFINER nas migrations novas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/ci/checar-definer.mjs

      - name: Testes dos Workers e dos scripts de CI (node --test)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:node

      - name: Vitest
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test

      # hml-18b (H-54): o build sem env (sem banco: passa no exigirSchemaDoBanco do vite.config.ts) e a guarda de chunks — nenhuma tela
      # do registro nem a entrada com pdf, xlsx, motor, heic2any ou powersync no fecho estático (o powersync só no app do aluno; o
      # charts só na lista fechada). O manifest vem do build.manifest do vite.config.ts.
      - name: Build e chunks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npx vite build
          node scripts/ci/checar-chunks.mjs dist
