name: Check APK build

# Compila o APK assinado DA BRANCH pra provar que o Java/Gradle compilam e pra testar no aparelho
# ANTES do merge (mesmos passos do build-apk.yml até o APK). NÃO cria release nem faz bump de versão.
# Roda sozinho no push de qualquer branch (menos main/staging) que mexa no código nativo — o
# `workflow_dispatch` só funciona depois que o arquivo chegar na main (limite do GitHub).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, staging]
    paths:
      - "android/**"
      - "capacitor.config.*"
      - ".github/workflows/build-apk-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # igual ao build-apk.yml: o Gradle baixa platforms/build-tools que faltarem
          packages: platform-tools

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Compilando APK de checagem com versão: $CURRENT"

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          IFS='.' read -r MA MI PA <<< "$V"
          PA=${PA:-0}
          # mesma fórmula do build-apk.yml (Physiq 3.0: MAJOR*100000 — o APK de teste instala por cima da 2.136)
          CODE=$((MA * 100000 + MI * 100 + PA))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/physiqcalc-release.keystore

      - name: Firebase do push (google-services.json)
        # Physiq W20c: o arquivo vem do segredo GOOGLE_SERVICES_JSON e NUNCA entra no git; o android/app/build.gradle só aplica
        # o plugin do Google quando ele existe. Sem o segredo o APK sai sem push (o app segue com sino, e-mail e notificação local).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON vazio: APK sem push (FCM)"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json'); const ok=(j.client||[]).some((c)=>c&&c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.bertoldo.physiqcalc'); if(!ok){console.error('google-services.json sem o app com.bertoldo.physiqcalc');process.exit(1)} console.log('google-services.json escrito: projeto Firebase '+j.project_info.project_id)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          # banco principal do Physiq (spec 7.8): entra no APK antes da W3; ninguém lê ainda
          VITE_PRINCIPAL_URL: ${{ secrets.VITE_PRINCIPAL_URL }}
          VITE_PRINCIPAL_ANON_KEY: ${{ secrets.VITE_PRINCIPAL_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: physiqcalc-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Conferir o Firebase no APK
        # Physiq W20c: com o google-services.json, o Gradle tem que ter gerado o google_app_id (o push só liga com ele)
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "APK sem Firebase (sem o segredo GOOGLE_SERVICES_JSON): o push fica desligado"
            exit 0
          fi
          f=$(grep -rl 'google_app_id' android/app/build/generated --include=values.xml | head -1)
          if [ -z "$f" ]; then
            echo "::error::google-services NÃO foi aplicado (sem google_app_id nos recursos gerados)"
            exit 1
          fi
          echo "Firebase no APK: plugin google-services aplicado (google_app_id em $f)"

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}-check.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physiq-v${{ steps.version.outputs.current }}-check
          path: android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}-check.apk
          retention-days: 7
