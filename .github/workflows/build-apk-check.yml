name: Check APK build

# Compila o APK DA BRANCH pra provar que o Java/Gradle compilam ANTES do merge (mesmos passos do build-apk.yml até o APK).
# NÃO cria release nem faz bump de versão. W4 da loja: também o AAB da Google Play (job `aab-loja`, o mesmo do build-apk.yml).
# Roda sozinho no push de qualquer branch (menos main/staging) que mexa no código nativo — o
# `workflow_dispatch` só funciona depois que o arquivo chegar na main (limite do GitHub).
# hml-16b (H-45): a branch NUNCA recebe as chaves reais (moram no environment "assinatura", só da main). O APK e o AAB daqui
# saem assinados com chaves DESCARTÁVEIS geradas no próprio job — o APK não instala por cima do app do aparelho. Para testar no
# aparelho: Actions › "Check APK build" › Run workflow › branch + "chave_real" → job `apk-aparelho` (environment
# "assinatura-aparelho": espera a aprovação do dono no GitHub; artefato de 1 dia).
on:
  workflow_dispatch:
    inputs:
      chave_real:
        description: "APK com a chave REAL do site, para instalar no aparelho (pede a sua aprovação; artefato de 1 dia)"
        type: boolean
        default: false
  push:
    branches-ignore: [main, staging]
    paths:
      - "android/**"
      - "capacitor.config.*"
      - ".github/workflows/build-apk-check.yml"
      - "scripts/ci/**"
      # hml-13 (achado da hml-03): dependência nova (Capacitor e afins) muda o build nativo sem tocar em android/
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.chave_real }}
    runs-on: ubuntu-latest

    steps:
      # hml-16c (H-45): a chave real NUNCA chega no check da branch. As chaves moram só nos environments ("assinatura", só da
      # main; "assinatura-aparelho", com a aprovação do dono). Num job sem environment, o secrets.X só enxerga o repo: vazio = ok;
      # com valor = alguém pôs a chave de volta no repo → falha (o valor nunca aparece: o GitHub mascara e o passo não imprime).
      - name: Guarda — nenhuma chave real no check da branch (H-45)
        env:
          CHAVE_APK: ${{ secrets.KEYSTORE_BASE64 }}
          CHAVE_UPLOAD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PAT_POWERSYNC: ${{ secrets.POWERSYNC_PAT }}
        run: |
          if [ -n "$CHAVE_APK" ] || [ -n "$CHAVE_UPLOAD" ] || [ -n "$PAT_POWERSYNC" ]; then
            echo "::error::chave de assinatura ou PAT do PowerSync visível no check da branch (está no repo, fora do environment): tire do repo"
            exit 1
          fi
          echo "ok: nenhuma chave real no check da branch"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # igual ao build-apk.yml: o Gradle baixa platforms/build-tools que faltarem
          packages: platform-tools

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Compilando APK de checagem com versão: $CURRENT"

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          IFS='.' read -r MA MI PA <<< "$V"
          PA=${PA:-0}
          # mesma fórmula do build-apk.yml (Physiq 3.0: MAJOR*100000 — o APK de teste instala por cima da 2.136)
          CODE=$((MA * 100000 + MI * 100 + PA))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Firebase do push (google-services.json)
        # Physiq W20c: o arquivo vem do segredo GOOGLE_SERVICES_JSON e NUNCA entra no git; o android/app/build.gradle só aplica
        # o plugin do Google quando ele existe. Sem o segredo o APK sai sem push (o app segue com sino, e-mail e notificação local).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON vazio: APK sem push (FCM)"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json'); const ok=(j.client||[]).some((c)=>c&&c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.bertoldo.physiqcalc'); if(!ok){console.error('google-services.json sem o app com.bertoldo.physiqcalc');process.exit(1)} console.log('google-services.json escrito: projeto Firebase '+j.project_info.project_id)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        # hml-08 (H-22): o build do app (VITE_APP_NATIVO=1) — o painel master fica só no site (a Vercel segue no npm run build)
        run: npm run build:apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          # banco principal do Physiq (spec 7.8): entra no APK antes da W3; ninguém lê ainda
          VITE_PRINCIPAL_URL: ${{ secrets.VITE_PRINCIPAL_URL }}
          VITE_PRINCIPAL_ANON_KEY: ${{ secrets.VITE_PRINCIPAL_ANON_KEY }}
          # hml-10 (H-25): o build com banco exige o schema (vite.config.ts); os segredos acima são os de produção (os mesmos do
          # build-apk.yml), então o schema também. Texto, não segredo
          VITE_DB_SCHEMA: public

      - name: Conferir que o APK sai sem o painel master
        run: bash scripts/ci/sem-master.sh dist

      - name: Conferir que o APK sai sem os textos legais novos
        # hml-11 (H-28): a Política, os Termos e os Termos de assinatura novos esperam o advogado — só no build de staging até a virada
        run: bash scripts/ci/sem-texto-legal-novo.sh dist

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK assinado com chave DESCARTÁVEL
        # hml-16b (H-45): chave gerada agora (PKCS12, validade de 2 dias, senha aleatória), só no disco durante o Gradle
        run: |
          D="$(mktemp -d "$RUNNER_TEMP/chave-descartavel.XXXXXX")"
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          export KEYSTORE_PASSWORD KEY_PASSWORD="$KEYSTORE_PASSWORD" KEY_ALIAS=descartavel KEYSTORE_FILE="$D/descartavel.p12"
          (umask 077 && keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEYSTORE_FILE" -alias descartavel \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Physiq check descartavel" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD)
          FP="$(keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)"
          echo "APK_SHA256_DESCARTAVEL=$FP" >> "$GITHUB_ENV"
          echo "chave descartável do APK: SHA-256 $FP"
          rc=0
          (cd android && ./gradlew --no-daemon assembleRelease) || rc=$?
          rm -rf "$D"
          exit "$rc"

      - name: Conferir a assinatura descartável do APK
        # assinado (apksigner verify) com a chave gerada acima, e NUNCA com a do site nem com a de upload (scripts/ci/apk-assinatura.sh)
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          bash scripts/ci/apk-assinatura.sh descartavel "$APK" "$APK_SHA256_DESCARTAVEL"

      - name: Conferir o Firebase no APK
        # Physiq W20c: com o google-services.json, o Gradle tem que ter gerado o google_app_id (o push só liga com ele)
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "APK sem Firebase (sem o segredo GOOGLE_SERVICES_JSON): o push fica desligado"
            exit 0
          fi
          f=$(grep -rl 'google_app_id' android/app/build/generated --include=values.xml | head -1)
          if [ -z "$f" ]; then
            echo "::error::google-services NÃO foi aplicado (sem google_app_id nos recursos gerados)"
            exit 1
          fi
          echo "Firebase no APK: plugin google-services aplicado (google_app_id em $f)"

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}-check-descartavel.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Physiq-v${{ steps.version.outputs.current }}-check-descartavel
          path: android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}-check-descartavel.apk
          retention-days: 7

  # W4 da loja — o MESMO job do AAB da Google Play do build-apk.yml (scripts/ci/aab-loja.sh), na branch: prova o build e as
  # conferências ANTES do merge. Artifact "-loja-check" (7 dias). hml-16b (H-45): assinado com uma chave de upload DESCARTÁVEL
  # (a real mora no environment "assinatura", só da main); a conferência (a) roda no modo CHECK_DESCARTAVEL do aab-loja.sh.
  aab-loja:
    if: ${{ !inputs.chave_real }}
    runs-on: ubuntu-latest

    steps:
      # hml-16c (H-45): a chave real NUNCA chega no check da branch. As chaves moram só nos environments ("assinatura", só da
      # main; "assinatura-aparelho", com a aprovação do dono). Num job sem environment, o secrets.X só enxerga o repo: vazio = ok;
      # com valor = alguém pôs a chave de volta no repo → falha (o valor nunca aparece: o GitHub mascara e o passo não imprime).
      - name: Guarda — nenhuma chave real no check da branch (H-45)
        env:
          CHAVE_APK: ${{ secrets.KEYSTORE_BASE64 }}
          CHAVE_UPLOAD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PAT_POWERSYNC: ${{ secrets.POWERSYNC_PAT }}
        run: |
          if [ -n "$CHAVE_APK" ] || [ -n "$CHAVE_UPLOAD" ] || [ -n "$PAT_POWERSYNC" ]; then
            echo "::error::chave de assinatura ou PAT do PowerSync visível no check da branch (está no repo, fora do environment): tire do repo"
            exit 1
          fi
          echo "ok: nenhuma chave real no check da branch"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # igual ao job do APK: o Gradle baixa platforms/build-tools que faltarem
          packages: platform-tools

      - name: Versão (a mesma do APK)
        id: version
        run: bash scripts/ci/aab-loja.sh versao

      - name: Firebase do push (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci/aab-loja.sh firebase

      - name: Install dependencies
        run: npm ci

      - name: Site da versão da loja (build:loja) + Capacitor
        run: bash scripts/ci/aab-loja.sh web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_PRINCIPAL_URL: ${{ secrets.VITE_PRINCIPAL_URL }}
          VITE_PRINCIPAL_ANON_KEY: ${{ secrets.VITE_PRINCIPAL_ANON_KEY }}
          # hml-10 (H-25): o build com banco exige o schema (vite.config.ts); segredos de produção, schema de produção. Texto
          VITE_DB_SCHEMA: public

      - name: AAB assinado com chave de upload DESCARTÁVEL
        # hml-16b (H-45): chave gerada agora (PKCS12, validade de 2 dias, senha aleatória), só no disco durante o Gradle
        run: |
          D="$(mktemp -d "$RUNNER_TEMP/upload-descartavel.XXXXXX")"
          PLAY_UPLOAD_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PLAY_UPLOAD_KEYSTORE_PASSWORD"
          export PLAY_UPLOAD_KEYSTORE_PASSWORD PLAY_UPLOAD_KEY_PASSWORD="$PLAY_UPLOAD_KEYSTORE_PASSWORD" PLAY_UPLOAD_KEY_ALIAS=descartavel
          export PLAY_UPLOAD_KEYSTORE_FILE="$D/upload-descartavel.p12"
          (umask 077 && keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$PLAY_UPLOAD_KEYSTORE_FILE" -alias descartavel \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Physiq check descartavel" \
            -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD -keypass:env PLAY_UPLOAD_KEY_PASSWORD)
          FP="$(keytool -J-Duser.language=en -list -v -keystore "$PLAY_UPLOAD_KEYSTORE_FILE" -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)"
          echo "SHA256_UPLOAD_ESPERADO=$FP" >> "$GITHUB_ENV"
          echo "chave descartável do AAB: SHA-256 $FP"
          rc=0
          bash scripts/ci/aab-loja.sh gradle || rc=$?
          rm -rf "$D"
          exit "$rc"

      - name: Conferir o AAB (assinatura descartável, permissão, site da loja, versionCode, Firebase)
        run: bash scripts/ci/aab-loja.sh conferir
        env:
          SUFIXO_AAB: -loja-check
          CHECK_DESCARTAVEL: "1"

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Physiq-v${{ steps.version.outputs.current }}-loja-check
          path: android/app/build/outputs/bundle/playRelease/Physiq-v${{ steps.version.outputs.current }}-loja-check.aab
          retention-days: 7
          if-no-files-found: error

  # hml-16b (H-45): o APK com a chave REAL do site, para instalar por cima do app no aparelho a partir de uma branch. Só à mão
  # (Run workflow com "chave_real"); o environment "assinatura-aparelho" espera a aprovação do dono no GitHub. Artefato de 1 dia.
  apk-aparelho:
    if: ${{ inputs.chave_real }}
    runs-on: ubuntu-latest
    environment: assinatura-aparelho

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # igual ao build-apk.yml: o Gradle baixa platforms/build-tools que faltarem
          packages: platform-tools

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Compilando APK de checagem com versão: $CURRENT"

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          IFS='.' read -r MA MI PA <<< "$V"
          PA=${PA:-0}
          # mesma fórmula do build-apk.yml (Physiq 3.0: MAJOR*100000 — o APK de teste instala por cima da 2.136)
          CODE=$((MA * 100000 + MI * 100 + PA))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Firebase do push (google-services.json)
        # Physiq W20c: o arquivo vem do segredo GOOGLE_SERVICES_JSON e NUNCA entra no git; o android/app/build.gradle só aplica
        # o plugin do Google quando ele existe. Sem o segredo o APK sai sem push (o app segue com sino, e-mail e notificação local).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON vazio: APK sem push (FCM)"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json'); const ok=(j.client||[]).some((c)=>c&&c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.bertoldo.physiqcalc'); if(!ok){console.error('google-services.json sem o app com.bertoldo.physiqcalc');process.exit(1)} console.log('google-services.json escrito: projeto Firebase '+j.project_info.project_id)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        # hml-08 (H-22): o build do app (VITE_APP_NATIVO=1) — o painel master fica só no site (a Vercel segue no npm run build)
        run: npm run build:apk
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          # banco principal do Physiq (spec 7.8): entra no APK antes da W3; ninguém lê ainda
          VITE_PRINCIPAL_URL: ${{ secrets.VITE_PRINCIPAL_URL }}
          VITE_PRINCIPAL_ANON_KEY: ${{ secrets.VITE_PRINCIPAL_ANON_KEY }}
          # hml-10 (H-25): o build com banco exige o schema (vite.config.ts); os segredos acima são os de produção (os mesmos do
          # build-apk.yml), então o schema também. Texto, não segredo
          VITE_DB_SCHEMA: public

      - name: Conferir que o APK sai sem o painel master
        run: bash scripts/ci/sem-master.sh dist

      - name: Conferir que o APK sai sem os textos legais novos
        # hml-11 (H-28): a Política, os Termos e os Termos de assinatura novos esperam o advogado — só no build de staging até a virada
        run: bash scripts/ci/sem-texto-legal-novo.sh dist

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK assinado com a chave REAL do site
        # a chave só existe no disco durante este passo; --no-daemon: o Gradle não fica com as variáveis da chave na memória
        run: |
          D="$(mktemp -d "$RUNNER_TEMP/chave-site.XXXXXX")"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$D/physiqcalc-release.keystore")
          unset KEYSTORE_BASE64
          export KEYSTORE_FILE="$D/physiqcalc-release.keystore"
          rc=0
          (cd android && ./gradlew --no-daemon assembleRelease) || rc=$?
          rm -rf "$D"
          exit "$rc"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Conferir que o APK saiu com a chave do site
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          bash scripts/ci/apk-assinatura.sh site "$APK"

      - name: Conferir o Firebase no APK
        # Physiq W20c: com o google-services.json, o Gradle tem que ter gerado o google_app_id (o push só liga com ele)
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "APK sem Firebase (sem o segredo GOOGLE_SERVICES_JSON): o push fica desligado"
            exit 0
          fi
          f=$(grep -rl 'google_app_id' android/app/build/generated --include=values.xml | head -1)
          if [ -z "$f" ]; then
            echo "::error::google-services NÃO foi aplicado (sem google_app_id nos recursos gerados)"
            exit 1
          fi
          echo "Firebase no APK: plugin google-services aplicado (google_app_id em $f)"

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}-aparelho.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Physiq-v${{ steps.version.outputs.current }}-aparelho
          path: android/app/build/outputs/apk/release/Physiq-v${{ steps.version.outputs.current }}-aparelho.apk
          retention-days: 1
          if-no-files-found: error
